name: Pages

# Deploys the static marketing site in site/ to GitHub Pages. Path-filtered so
# Go changes don't redeploy the page and page changes don't touch the gate.
#
# Repo Settings → Pages → Source is already "GitHub Actions"; this workflow is
# what actually publishes. It was dropped in e141550 while the site was still
# being written and is restored here with the site itself.

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/

      - id: deployment
        uses: actions/deploy-pages@v4
